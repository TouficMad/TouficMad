---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Record timezone name
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ common_timezone }}\n"
    mode: "0644"

- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell }}"
    groups: sudo
    append: true
  loop: "{{ common_admin_users }}"

- name: Write a message of the day
  ansible.builtin.copy:
    dest: /etc/motd
    content: |
      {{ inventory_hostname }} is managed by Ansible. Manual changes will be overwritten.
    mode: "0644"
