---
- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed node_exporter version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download and install node_exporter
  when: node_exporter_version not in (node_exporter_installed.stdout | default('')) ~ (node_exporter_installed.stderr | default(''))
  block:
    - name: Download node_exporter archive
      ansible.builtin.unarchive:
        src: "{{ node_exporter_url }}"
        dest: /tmp
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_release }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        mode: "0755"
      notify: Restart node_exporter
      # In --check mode the archive is not really extracted
      ignore_errors: "{{ ansible_check_mode }}"

- name: Install systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Start and enable node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  # On a fresh host in --check mode the unit does not exist yet
  ignore_errors: "{{ ansible_check_mode }}"
