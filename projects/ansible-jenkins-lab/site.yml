---
- name: Configure web servers
  hosts: web
  become: true
  roles:
    - common
    - nginx
    - node_exporter

- name: Verify the deployment
  hosts: web
  gather_facts: false
  tags: verify
  tasks:
    - name: Nginx answers on port 80
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}/"
        return_content: true
      register: page
      delegate_to: localhost
      when: not ansible_check_mode
      failed_when: inventory_hostname not in page.content

    - name: Node exporter answers on port 9100
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}:9100/metrics"
      delegate_to: localhost
      when: not ansible_check_mode
