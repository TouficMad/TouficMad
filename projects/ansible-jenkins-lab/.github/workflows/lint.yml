name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core==2.17.5 ansible-lint==24.9.2 yamllint==1.35.1
      - run: yamllint .
      - run: ansible-lint
      - run: ansible-playbook site.yml --syntax-check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t lab-target docker/target
