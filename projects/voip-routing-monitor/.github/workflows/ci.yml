name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint & test exporter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exporter/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8
      - run: pytest -v

  monitoring:
    name: Validate Prometheus & Alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v2.55.0 \
            check rules /m/prometheus/rules/recording.yml /m/prometheus/rules/alerts.yml
      - name: promtool test rules (alert unit tests)
        run: |
          docker run --rm -v "$PWD/monitoring:/m" -w /m/prometheus/tests --entrypoint promtool \
            prom/prometheus:v2.55.0 test rules alerts_test.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /m/alertmanager/alertmanager.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/voice-routing.json > /dev/null

  image:
    name: Build & publish image
    needs: [test, monitoring]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t routing-monitor exporter
      - name: Smoke test
        run: |
          docker run -d --name rm -p 9200:9200 -e CALLS_PER_SECOND=100 routing-monitor
          for i in $(seq 1 20); do curl -fs localhost:9200/health && break; sleep 1; done
          sleep 3
          curl -fs localhost:9200/metrics | grep voip_calls_total
          curl -fs localhost:9200/api/routing-plan
      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag routing-monitor "$IMAGE:${{ github.sha }}"
          docker tag routing-monitor "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
