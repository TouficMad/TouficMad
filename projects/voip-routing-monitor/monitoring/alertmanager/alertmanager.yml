route:
  receiver: default
  group_by: [alertname, carrier, destination]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Uncomment to send alerts to Slack (create an incoming webhook first):
    # slack_configs:
    #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #     channel: "#noc-voice"
    #     send_resolved: true
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # If the exporter is down, don't also page for missing traffic
  - source_matchers: [alertname="RoutingMonitorDown"]
    target_matchers: [alertname="VoipNoTraffic"]
