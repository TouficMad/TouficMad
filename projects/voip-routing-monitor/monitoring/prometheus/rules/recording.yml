# KPIs computed from raw counters, so they work over any time range.
groups:
  - name: voip-kpis
    rules:
      - record: route:voip_asr:ratio_rate5m
        expr: |
          sum by (carrier, destination) (rate(voip_calls_answered_total[5m]))
            / sum by (carrier, destination) (rate(voip_calls_total[5m]))

      - record: route:voip_ner:ratio_rate5m
        expr: |
          sum by (carrier, destination) (rate(voip_calls_network_effective_total[5m]))
            / sum by (carrier, destination) (rate(voip_calls_total[5m]))

      - record: route:voip_acd_seconds:rate5m
        expr: |
          sum by (carrier, destination) (rate(voip_call_duration_seconds_sum[5m]))
            / sum by (carrier, destination) (rate(voip_call_duration_seconds_count[5m]))

      - record: route:voip_pdd_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (le, carrier, destination) (rate(voip_pdd_seconds_bucket[5m])))

      - record: route:voip_calls:rate5m
        expr: sum by (carrier, destination) (rate(voip_calls_total[5m]))

      - record: carrier:voip_asr:ratio_rate5m
        expr: |
          sum by (carrier) (rate(voip_calls_answered_total[5m]))
            / sum by (carrier) (rate(voip_calls_total[5m]))

      - record: route:voip_minutes:rate1h
        expr: sum by (carrier, destination) (increase(voip_call_duration_seconds_sum[1h])) / 60
