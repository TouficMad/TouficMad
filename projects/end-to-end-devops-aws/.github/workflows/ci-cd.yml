name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # AWS OIDC

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: taskapp
  ECR_REPOSITORY: taskapp

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8
      - run: pytest -v

  lint-infra:
    name: Terraform & Helm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
      - uses: azure/setup-helm@v4
      - run: helm lint helm/taskapp
      - run: helm template taskapp helm/taskapp --set image.tag=test > /dev/null

  build:
    name: Build & scan image
    needs: [test, lint-infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t taskapp:${{ github.sha }} app
      - name: Smoke test container
        run: |
          docker run -d --name taskapp -p 8080:8080 taskapp:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs -X POST localhost:8080/api/tasks -H 'Content-Type: application/json' -d '{"title":"ci"}'
          curl -fs localhost:8080/metrics | grep http_requests_total
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskapp:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0" # report only; set to "1" to fail the build

  deploy:
    name: Push to ECR & deploy to EKS
    needs: build
    # Runs on main once the AWS infrastructure exists (see README step 3)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE" app
          docker push "$IMAGE"
      - uses: azure/setup-helm@v4
      - name: Deploy with Helm
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          helm upgrade --install taskapp helm/taskapp \
            --namespace taskapp \
            --set image.repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m --atomic
      - name: Show endpoint
        run: kubectl get svc taskapp -n taskapp
