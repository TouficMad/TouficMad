# Tells the kube-prometheus-stack Prometheus to scrape taskapp.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskapp
  namespace: taskapp
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taskapp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskapp
  namespace: taskapp
  labels:
    release: monitoring
spec:
  groups:
    - name: taskapp
      rules:
        - alert: TaskAppHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="taskapp",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="taskapp"}[5m])), 1e-9) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of taskapp requests are failing
        - alert: TaskAppSlowResponses
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="taskapp"}[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: taskapp p95 latency above 500ms
