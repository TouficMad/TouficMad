groups:
  - name: taskapp
    rules:
      - alert: TaskAppDown
        expr: up{job="taskapp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "taskapp is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}."

      - alert: TaskAppHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="taskapp",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="taskapp"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: TaskAppSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="taskapp"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 500ms"
